apiVersion: v1
kind: Service
metadata:
  name: ingestion-api
  namespace: nba-event-platform
spec:
  type: NodePort
  selector:
    app: ingestion-api
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-api
  namespace: nba-event-platform
spec:
  selector:
    matchLabels:
      app: ingestion-api
  template:
    metadata:
      labels:
        app: ingestion-api
    spec:
      containers:
        - name: ingestion-api
          image: nba-event-platform-ingestion-api:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: application-config
            - secretRef:
                name: application-credentials
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: '3000'
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
