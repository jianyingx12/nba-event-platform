apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-state-worker
  namespace: nba-event-platform
spec:
  selector:
    matchLabels:
      app: game-state-worker
  template:
    metadata:
      labels:
        app: game-state-worker
    spec:
      containers:
        - name: game-state-worker
          image: nba-event-platform-game-state-worker:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: application-config
            - secretRef:
                name: application-credentials
          env:
            - name: CONSUMER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HEALTH_PORT
              value: '3000'
            - name: CLAIM_IDLE_MS
              value: '5000'
          ports:
            - name: health
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
