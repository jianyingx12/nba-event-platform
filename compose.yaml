name: nba-event-platform

services:
  ingestion-api:
    build:
      context: .
      dockerfile: apps/ingestion-api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nba
      HOST: 0.0.0.0
      PORT: 3000
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  game-state-worker:
    build:
      context: .
      dockerfile: workers/game-state/Dockerfile
    environment:
      CONSUMER_NAME: game-state-worker-1
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nba
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  box-score-worker:
    build:
      context: .
      dockerfile: workers/box-score/Dockerfile
    environment:
      CONSUMER_NAME: box-score-worker-1
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nba
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-worker:
    build:
      context: .
      dockerfile: workers/analytics/Dockerfile
    environment:
      CONSUMER_NAME: analytics-worker-1
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nba
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  replay-service:
    build:
      context: .
      dockerfile: apps/replay-service/Dockerfile
    environment:
      FIXTURE_PATH: /app/data/fixtures/sample-game.json
      INGESTION_API_URL: http://ingestion-api:3000
      REPLAY_SPEED: max
    depends_on:
      ingestion-api:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nba
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nba']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
